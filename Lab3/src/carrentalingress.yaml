apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carrental
  labels:
    app: carrental
spec:
  rules:
    - host: carrental.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: carrental
                port:
                  number: 8080